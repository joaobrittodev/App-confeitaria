<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#f5f1e8" rx="40"/>

  <!-- Cake body -->
  <rect x="50" y="70" width="100" height="70" fill="#a85c3e" rx="5"/>

  <!-- Cake layers separation -->
  <rect x="50" y="95" width="100" height="2" fill="#8b4a2e"/>
  <rect x="50" y="120" width="100" height="2" fill="#8b4a2e"/>

  <!-- Frosting on top -->
  <path d="M 50 70 Q 60 50 100 45 Q 140 50 150 70 Z" fill="#d4845c"/>

  <!-- Frosting swirl details -->
  <circle cx="75" cy="65" r="4" fill="#e8a87c"/>
  <circle cx="100" cy="58" r="4" fill="#e8a87c"/>
  <circle cx="125" cy="65" r="4" fill="#e8a87c"/>

  <!-- Candles -->
  <rect x="85" y="40" width="3" height="15" fill="#ffd700"/>
  <rect x="100" y="35" width="3" height="20" fill="#ffd700"/>
  <rect x="115" y="40" width="3" height="15" fill="#ffd700"/>

  <!-- Flame 1 -->
  <ellipse cx="86.5" cy="38" rx="2.5" ry="3.5" fill="#ff6b35"/>

  <!-- Flame 2 -->
  <ellipse cx="101.5" cy="33" rx="2.5" ry="3.5" fill="#ff6b35"/>

  <!-- Flame 3 -->
  <ellipse cx="116.5" cy="38" rx="2.5" ry="3.5" fill="#ff6b35"/>

  <!-- Plate -->
  <rect x="45" y="142" width="110" height="4" fill="#d4a574" rx="2"/>
  <ellipse cx="100" cy="142" rx="58" ry="3" fill="#e8c4a0" opacity="0.5"/>
</svg>
